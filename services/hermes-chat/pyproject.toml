[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "newscraft-hermes-chat"
version = "0.1.0"
description = "Standard Hermes AG-UI runtime for NewsCraft chat"
requires-python = ">=3.11"
dependencies = [
  "ddgs>=9,<10",
  "uvicorn>=0.35,<1",
]

[project.scripts]
newscraft-hermes-chat = "hermes_chat.service:main"

[tool.setuptools.packages.find]
where = ["src"]
