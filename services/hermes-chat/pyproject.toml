[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "newscraft-agent"
version = "0.1.0"
description = "Owned cloud research agent for NewsCraft chat"
requires-python = ">=3.11,<3.12"
dependencies = [
  "ddgs>=9,<10",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "uvicorn>=0.35,<1",
]

[project.scripts]
newscraft-agent = "hermes_chat.service:main"

[tool.setuptools.packages.find]
where = ["src"]
